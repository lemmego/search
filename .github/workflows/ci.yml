# This workflow runs in THIS module's own repository, where the repository
# root is the module root.
#
# That is why there are no `paths:` filters and no `cd` into a subdirectory.
# The three workflows that used to exist in this monorepo were written as
# though it were a single repository, filtering on paths like "api/**" and
# "go.work" which do not exist in a per-module checkout. They therefore never
# triggered — `gh run list` reported zero runs for queue and tasker ever, and
# nothing but GitHub's own Dependency Graph for api — and every step would
# have failed if they had, since `cd api`, `go build ./api/...` and
# `go work sync` all name things that are not there.
#
# There is also no GOWORK=off step. That distinction matters in the monorepo
# working tree, where a workspace can mask a missing requirement; here there
# is no go.work at all, so the ordinary run already is the standalone one.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lemmego_search_test
        ports: ['5432:5432']
        # Without a health check the first step can connect before Postgres
        # accepts connections, which surfaces as a test failure rather than as
        # the startup race it is.
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      # The second engine, and the reason the contract is a contract rather
      # than a description of what the first engine happened to do. Without
      # it the whole engine/meili package and nineteen of twenty conformance
      # cases skip, and a suite that skips exits 0 — which is
      # indistinguishable from one that passed.
      #
      # No master key is set, so the instance runs with no authentication.
      # That is right for a disposable service on a job's own network and
      # wrong anywhere else; the engine's own tests prove the key is sent
      # when one is configured.
      meilisearch:
        image: getmeili/meilisearch:v1.11
        env:
          MEILI_ENV: development
          MEILI_NO_ANALYTICS: 'true'
        ports: ['7700:7700']
        # curl rather than wget: the image carries one and not the other, and
        # a health check whose command is absent never becomes healthy — the
        # job then waits out the full startup timeout and fails on the
        # service rather than on anything it tested.
        options: >-
          --health-cmd "curl -fsS http://localhost:7700/health || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      # go-version-file rather than a literal: the module declares the version
      # it needs. The old workflow ran a matrix of 1.25 and 1.26 against
      # modules that declare go 1.27, so it was testing something nobody runs.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: go.mod and go.sum are tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -count=1 ./...
        env:
          SEARCH_POSTGRES_DSN: "postgres://postgres:postgres@127.0.0.1:5432/lemmego_search_test?sslmode=disable"
          SEARCH_MEILISEARCH_URL: "http://127.0.0.1:7700"

      # Both suites must actually run, and the giveaway when they do not is
      # the runtime — this project has twice read a 1.3-second skip as a pass.
      # So the count is asserted rather than eyeballed: every conformance
      # case that is skipped for a missing service is one nothing checked.
      - name: Neither engine's suite was skipped for a missing service
        run: |
          go test -count=1 -v ./... > /tmp/verbose.txt 2>&1 || true
          for suite in TestPostgresConformsToTheEngineContract \
                       TestMeilisearchConformsToTheEngineContract; do
            if grep -q "^--- SKIP: $suite\b" /tmp/verbose.txt; then
              echo "$suite was skipped, so its engine was never reached."
              grep -A2 "^--- SKIP: $suite" /tmp/verbose.txt
              exit 1
            fi
            if ! grep -q "^--- PASS: $suite\b" /tmp/verbose.txt; then
              echo "$suite neither passed nor was skipped; it did not run."
              exit 1
            fi
          done
        env:
          SEARCH_POSTGRES_DSN: "postgres://postgres:postgres@127.0.0.1:5432/lemmego_search_test?sslmode=disable"
          SEARCH_MEILISEARCH_URL: "http://127.0.0.1:7700"
